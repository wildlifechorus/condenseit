model: "llama3.2:3b"
# Maximum articles per digest run. Override with CONDENSEIT_MAX_ARTICLES_PER_DIGEST.
max_articles_per_digest: 50
# Reserve one slot per category before filling remaining slots by rank.
balance_digest_categories: true
# Maximum articles from any single category in the balanced digest.
max_articles_per_category: 5
# Articles older than this many hours are excluded from ranking.
# Set to 0 to disable the age gate.
max_article_age_hours: 36

# Digest schedule (used by the built-in scheduler when CONDENSEIT_SCHEDULER_ENABLED=1).
# Times are interpreted in the configured timezone (24-hour HH:MM).
# timezone: IANA timezone name (e.g. "America/New_York", "Europe/London", "Asia/Tokyo").
#   Defaults to "UTC". Can also be set via the Admin > Schedule UI.
schedule:
  timezone: "UTC"
  times: ["07:00", "18:00"]

feeds:
  # General News
  - url: "https://www.theguardian.com/europe/rss"
    category: "General News"
    priority: 2
  - url: "https://www.theguardian.com/world/rss"
    category: "General News"
    priority: 2

  # Developer News
  - url: "https://cursor.com/changelog/rss.xml"
    category: "Developer News"
    priority: 1

  # Infosec News
  - url: "https://www.darkreading.com/rss.xml"
    category: "Infosec News"
    priority: 1
  - url: "https://feeds.feedburner.com/TheHackersNews"
    category: "Infosec News"
    priority: 1
  - url: "https://www.bleepingcomputer.com/feed/"
    category: "Infosec News"
    priority: 1

youtube_channels: []

watch_urls: []

# ---------------------------------------------------------------------------
# The source types below (google_news, hackernews, reddit, github_releases)
# are managed entirely through Admin > Sources in the web UI. They are not
# configurable via config.yaml; the entries here are for reference only.
#
# Google News search - no API key required.
# Supports operators: site:, when:, intitle:, source:, inurl:
# Example queries:
#   "site:reuters.com when:1d"
#   "CVE intitle:critical when:7d"
#   "\"supply chain\" site:bleepingcomputer.com"
#
# Hacker News - no API key required.
# Feeds: top, best, new, ask, show
# Configure min_score and max_items via the UI.
#
# Reddit - no API key required.
# Any public subreddit, e.g. netsec, machinelearning, programming
# Supports hot/new/top/rising with time filter and min score.
#
# GitHub Releases - no API key required.
# Enter the repo as owner/repo, e.g. astral-sh/uv or ollama/ollama
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Keyword exclusion filter
# Articles whose title or description (first 500 chars) contains any of
# these phrases (case-insensitive substring match) are dropped before
# ranking. Add as many entries as needed; empty list disables the filter.
# ---------------------------------------------------------------------------
exclude_keywords:
  - "Community Forum"
  - "promotional code"
  - "promotional campaign"
#  - "sponsored"

relevance:
  # Minimum ratings before preference learning activates.
  min_ratings_for_learning: 5
  # Weight of the TF-IDF cosine similarity component (term-level profile).
  tfidf_preference_weight: 0.35
  # Weight applied to per-category mean-rating deviation from neutral (3.0).
  category_preference_weight: 0.6
  # Weight applied to per-source (feed) mean-rating deviation from neutral.
  source_preference_weight: 0.3
  # Exponential time-decay half-life in days (e.g. 30 = rating from 30 days
  # ago contributes half as much as one made today).
  rating_decay_half_life_days: 30
  # How strongly implicit engagement signals (read, saved for later, dismissed)
  # influence ranking relative to explicit star ratings.
  # 0 = disabled; 0.5 = half the weight of star ratings; 1.0 = equal weight.
  # All six relevance weights can also be overridden live in Admin > Settings.
  implicit_signal_weight: 0.5

  initial_keywords:
    high: ["kubernetes", "CVE", "security", "breaking change", "cursor", "llm"]
    medium: ["docker", "github", "python", "go", "rust", "fpv", "drone"]

  # Optional synonym groups: terms in the same group propagate profile weight
  # to each other during scoring. Keys are arbitrary labels; values are
  # lists of equivalent lowercase terms.
  # topic_synonyms:
  #   kubernetes: ["k8s", "helm", "kubectl"]
  #   security:   ["infosec", "cybersecurity", "appsec"]
  #   ai:         ["llm", "gpt", "generative"]

output:
  format: "both"
  path: "data/digests"

# ---------------------------------------------------------------------------
# LLM configuration
#
# Two modes:
#   Local:  provider: "ollama" - runs on your Mac/server with Ollama
#   Remote: provider: "openrouter" - uses OpenRouter cloud API
#   Both:   provider: "fallback" - tries Ollama first, falls back to OpenRouter
# ---------------------------------------------------------------------------
llm:
  provider: "openrouter"

  # Local Ollama (used when provider is "ollama" or "fallback")
  ollama_host: "${OLLAMA_HOST:-http://localhost:11434}"
  # Set to false when connecting to a remote Ollama instance.
  manage_lifecycle: true

  # OpenRouter (used when provider is "openrouter" or "fallback")
  # API key comes from OPENROUTER_API_KEY env var (required by default).
  openrouter_model: "qwen/qwen3.5-flash-02-23"
  # Hard limits to prevent runaway costs. Pipeline stops if exceeded.
  openrouter_daily_budget_usd: 1.0
  openrouter_monthly_budget_usd: 10.0
  # When true, picks the cheapest available model (re-checked hourly).
  openrouter_pick_cheapest: false

# VPS deployment (used by scripts/deploy.sh)
# Leave host empty until you have a real SSH target.
# Override with DIGEST_PWA_SSH_HOST, DIGEST_PWA_REMOTE_DIR, DIGEST_PWA_LIVE_URL.
# ---------------------------------------------------------------------------
vps:
  enabled: true
  host: ""
  path: "/var/www/digest.example.com"
  ssh_key: "~/.ssh/id_ed25519"
  ssh_port: 22
  digest_url: "https://digest.example.com"

