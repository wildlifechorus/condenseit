  # Ukraine
  - handle: "@DenysDavydov"
    channel_id: "UCpr-NNORb2UQYDD3k-w-OFg"
    category: "Ukraine"

  # AI News
  - handle: "@aiexplained-official"
    channel_id: "UCNJ1Ymd5yFuUPtn21xtRbbw"
    category: "AI News"
  - handle: "@ThePrimeTimeagen"
    channel_id: "UC8ENHE5xdFSwx71u3fDH5Xw"
    category: "AI News"

  # FPV News
  - handle: "@oscarliang"
    channel_id: "UCX3eufnI7A2I7IkKHZn8KSQ"
    category: "FPV News"

  # General Interesting
  - handle: "@BennJordan"
    channel_id: "UC213K1tH6XJwHj6ZiVtLDrw"
    category: "General Interesting"
  - handle: "@rossmanngroup"
    channel_id: "UC6nZlvfz4YWoBWbjiaYJA3g"
    category: "General Interesting"

watch_urls: []

relevance:
  # Minimum number of ratings before the preference engine starts influencing
  # article ranking. Avoids noisy signals when you only have a few ratings.
  min_ratings_for_learning: 5

  # Weight of the TF-IDF cosine similarity component (term-level profile).
  tfidf_preference_weight: 0.35

  # Weight applied to per-category mean-rating deviation from neutral (3.0).
  # Set to 0 to disable category-level preference learning.
  category_preference_weight: 0.6

  # Weight applied to per-source (feed) mean-rating deviation from neutral.
  # Set to 0 to disable source-level preference learning.
  source_preference_weight: 0.3

  # Half-life in days for the exponential time-decay applied to each rating.
  # A rating made 30 days ago contributes half as much as one made today.
  # Set to a very large number (e.g. 3650) to effectively disable decay.
  rating_decay_half_life_days: 30

  initial_keywords:
    high: ["kubernetes", "CVE", "security", "breaking change", "cursor", "llm"]
    medium: ["docker", "github", "python", "go", "rust", "fpv", "drone"]

output:
  format: "both"
  path: "data/digests"

digest_pwa:
  output_dir: "data/pwa-dist"
  # Baked into pwa-build: optional GET URL whose JSON fills missing PWA keys
  # only (localStorage wins if you already rated that URL).
  ratings_merge_url: ""
  # Host-only: optional path/URL merged into SQLite before each ``condenseit
  # run`` (same JSON as PWA export). Bearer token only via env (see .env.example).
  #
  # To enable remote rating via your VPS:
  #   1. Run scripts/bootstrap-ratings-service.sh (one-time VPS setup)
  #   2. Set CONDENSEIT_VPS_WITH_SERVICE=1 and run deploy-digest-pwa.sh
  #   3. Point ratings_import_url at your live site's export endpoint:
  #        ratings_import_url: "https://digest.example.com/api/ratings/export"
  #   Each local digest run will then pull remote ratings automatically.
  ratings_import_path: ""
  ratings_import_url: ""

llm:
  provider: "ollama"
  ollama_host: "${OLLAMA_HOST:-http://localhost:11434}"
  manage_lifecycle: true
  openrouter_model: "openai/gpt-4o-mini"
  openrouter_daily_budget_usd: 1.0
  openrouter_monthly_budget_usd: 10.0
  openrouter_pick_cheapest: false

# Post-run: email and VPS deploy are on by default. Without keys or host you
# get clear "not run" lines in the CLI and in the Run digest banner (not a
# silent skip).
email:
  enabled: true
  resend_api_key: "${RESEND_API_KEY}"
  # Optional: substitute from the shell; RESEND_FROM / DIGEST_EMAIL_TO override
  # these when set (see docs/configuration.md).
  from: "${RESEND_FROM:-CondenseIt <digest@example.com>}"
  to: "${DIGEST_EMAIL_TO:-you@example.com}"

vps:
  enabled: true
  # Leave empty until you have a real SSH target; rsync runs only when set.
  # You can set DIGEST_PWA_SSH_HOST (and path/URL) in .env instead; see .env.example.
  host: ""
  path: "/var/www/condenseit/"
  ssh_key: "~/.ssh/id_ed25519"
  ssh_port: 22
  digest_url: "https://digest.example.com"
