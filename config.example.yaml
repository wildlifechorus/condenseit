model: "llama3.2:3b"
# YAML default here is illustrative; App code defaults to 50. Override with env
# CONDENSEIT_MAX_ARTICLES_PER_DIGEST for one-off runs.
max_articles_per_digest: 50
# When true, reserve one slot per category (in rank order) before filling.
balance_digest_categories: true
# Maximum articles from any single category in the balanced digest (default: 5).
max_articles_per_category: 5
# Articles older than this many hours (by published_at) are excluded from the
# digest. Set to 0 to disable the age gate. Default: 36.
max_article_age_hours: 36

schedule:
  times: ["07:00", "18:00"]

feeds:
  # General News
  - url: "https://www.theguardian.com/europe/rss"
    category: "General News"
    priority: 2
  - url: "https://www.theguardian.com/world/rss"
    category: "General News"
    priority: 2

  # Ukraine
  - url: "https://www.theguardian.com/world/ukraine/rss"
    category: "Ukraine"
    priority: 1

  # Developer News
  - url: "https://cursor.com/changelog/rss.xml"
    category: "Developer News"
    priority: 1

  # FPV News
  - url: "https://oscarliang.com/feed/"
    category: "FPV News"
    priority: 2

  # Infosec News
  - url: "https://aspicts.substack.com/feed"
    category: "Infosec News"
    priority: 1
  - url: "https://www.darkreading.com/rss.xml"
    category: "Infosec News"
    priority: 1
  - url: "https://feeds.feedburner.com/TheHackersNews"
    category: "Infosec News"
    priority: 1
  - url: "https://www.bleepingcomputer.com/feed/"
    category: "Infosec News"
    priority: 1

