# CondenseIt nginx vhost
#
# Copy this file to scripts/nginx/<your-domain>.conf and replace
# "digest.example.com" with your actual domain, then run:
#   ./scripts/bootstrap-server.sh
#
# After deploying:
#   ssh your-vps 'sudo certbot --nginx -d <your-domain>'
#
# This assumes the CondenseIt web service runs on 127.0.0.1:8765
# (started by bootstrap-server.sh as condenseit-web.service).

server {
    listen 80;
    listen [::]:80;
    server_name digest.example.com;

    root /var/www/digest.example.com;
    index index.html;

    # ------------------------------------------------------------------
    # CondenseIt API - proxy all /api/* routes to the FastAPI service.
    # Handles auth, digest runs, ratings, read tracking, budget, etc.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Static SPA files (frontend/dist output)
    # ------------------------------------------------------------------

    # Entry point: no-cache so users always get the latest SPA shell.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Vite content-hashed bundles: safe to cache forever.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/digest.example.com.access.log;
    error_log  /var/log/nginx/digest.example.com.error.log;
}
