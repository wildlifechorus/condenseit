# HTTP only. After `certbot --nginx -d digest.example.com`, Certbot will add
# the ssl_certificate lines to this file (or a companion snippet).
#
# This config assumes the CondenseIt web service runs on 127.0.0.1:8765
# (set up via scripts/bootstrap-ratings-service.sh). If you do not run the
# service, remove the proxy_pass blocks below and serve purely static files.
server {
    listen 80;
    listen [::]:80;
    server_name digest.example.com;

    root /var/www/digest.example.com;
    index index.html latest.html;

    # ------------------------------------------------------------------
    # CondenseIt ratings API + rate page
    # Proxy to the local FastAPI service so article ratings persist
    # server-side and the local machine can pull them via ratings_import_url.
    # ------------------------------------------------------------------
    location = /rate {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ratings {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Static PWA files
    # ------------------------------------------------------------------

    # Entry point: never cache so users always see the latest digest.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Digest JSON is rewritten on every pwa-build.
    location = /digest-data.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Vite content-hashed bundles: filename changes when content changes,
    # so it is safe to cache them forever in the browser.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA uses index.html; optional legacy static export uses latest.html
    location = / {
        try_files /index.html /latest.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    access_log /var/log/nginx/digest.example.com.access.log;
    error_log /var/log/nginx/digest.example.com.error.log;
}
