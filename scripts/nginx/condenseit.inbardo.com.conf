# CondenseIt nginx vhost - condenseit.inbardo.com
#
# This instance sits behind Cloudflare proxy. Cloudflare terminates TLS and
# forwards plain HTTP to this server, so no SSL block or certbot is needed.
#
# This file is installed by scripts/bootstrap-server.sh --instance inbardo.
#
# The CondenseIt web service for this instance runs on 127.0.0.1:8766
# (started as condenseit-inbardo.service by bootstrap-server.sh).

server {
    listen 80;
    listen [::]:80;
    server_name condenseit.inbardo.com;

    root /var/www/condenseit.inbardo.com;
    index index.html;

    # ------------------------------------------------------------------
    # Health check - unauthenticated, used for smoke tests and uptime
    # monitors. Must be proxied separately because /health is not under
    # /api/ and would otherwise be served as the SPA fallback.
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # CondenseIt API - proxy all /api/* routes to the FastAPI service.
    # Handles auth, digest runs, ratings, read tracking, budget, etc.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Static SPA files (frontend/dist output)
    # ------------------------------------------------------------------

    # Entry point: no-cache so users always get the latest SPA shell.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Vite content-hashed bundles: safe to cache forever.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/condenseit.inbardo.com.access.log;
    error_log  /var/log/nginx/condenseit.inbardo.com.error.log;
}
